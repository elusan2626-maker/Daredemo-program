<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>誰でもプログラマー（誰プロ）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title-logo {
      font-weight: 800;
      font-size: 1rem;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, .link-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-run {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .btn-pub {
      background: #059669;
      border-color: #059669;
      color: #ffffff;
    }
    .wrap {
      max-width: 1100px;
      margin: 14px auto;
      padding: 0 12px 40px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .tpl-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-switch button.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    @media (max-width: 640px) {
      .meta-grid {
        grid-template-columns: 1fr;
      }
    }
    .input-box {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
    }
    textarea.editor {
      width: 100%;
      height: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.86rem;
      line-height: 1.5;
      resize: vertical;
    }
    .media-area {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
    }
    .media-flex {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    iframe.stage {
      width: 100%;
      height: 440px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
    }
    .notice {
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e3a8a;
      margin-bottom: 12px;
    }
    .share-box {
      display: none;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .share-box.show { display: block; }
    .url-block {
      margin-top: 10px;
    }
    .url-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #065f46;
      margin-bottom: 4px;
    }
    .url-warn {
      display: block;
      font-size: 0.76rem;
      color: #b45309;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .share-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .share-url {
      flex: 1;
      min-width: 200px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #34d399;
      background: #ffffff;
      font-size: 0.86rem;
    }
    /* 公開ページ（閲覧専用・編集不可） */
    .viewer-top {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .viewer-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }
    .viewer-author {
      font-size: 0.78rem;
      color: #475569;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }
    .viewer-full {
      width: 100%;
      height: calc(100vh - 50px);
      border: 0;
      display: block;
      background: #ffffff;
    }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <!-- 公開ページ閲覧モード（見る・遊ぶ専用） -->
  <div id="viewerScreen" class="hide">
    <div class="viewer-top">
      <div class="viewer-meta">
        <strong id="vTitle">読み込み中...</strong>
        <span id="vAuthor" class="viewer-author"></span>
      </div>
      <div class="btn-row">
        <a id="vHomeLink" class="link-btn" href="./">誰プロで作る</a>
      </div>
    </div>
    <iframe id="vFrame" class="viewer-full" sandbox="allow-scripts allow-forms allow-modals"></iframe>
  </div>

  <!-- 作成・本人修正モード -->
  <div id="editorScreen" class="hide">
    <header>
      <div class="title-logo" id="editorHeaderTitle">誰プロ</div>
      <div class="btn-row">
        <button id="runCodeBtn" type="button" class="btn-run">▶ 実行</button>
        <button id="publishCodeBtn" type="button" class="btn-pub">🚀 公開する</button>
      </div>
    </header>

    <div class="wrap">
      <div id="shareBox" class="share-box">
        <strong>🎉 ページを保存しました！</strong>

        <div class="url-block">
          <span class="url-label">① 友だちに教える「見る用URL」（他の人は編集できません）</span>
          <div class="share-row">
            <input id="viewUrlInput" class="share-url" type="text" readonly />
            <button id="copyViewBtn" type="button" class="btn-run">コピー</button>
            <a id="openViewLink" class="link-btn" target="_blank" rel="noopener">開く</a>
          </div>
        </div>

        <div class="url-block">
          <span class="url-warn">② 作った本人だけの「あとから修正する用URL」（他の人には教えないで保存してください）</span>
          <div class="share-row">
            <input id="editUrlInput" class="share-url" type="text" readonly />
            <button id="copyEditBtn" type="button">コピー</button>
          </div>
        </div>
      </div>

      <div id="msgBox" class="notice">テンプレートを選ぶかコードを書いて「▶ 実行」を押してみよう！</div>

      <div class="card tpl-list">
        <span style="font-size:0.82rem; font-weight:700; color:#64748b;">テンプレ：</span>
        <button type="button" class="tplBtn" data-id="card">自己紹介</button>
        <button type="button" class="tplBtn" data-id="luck">おみくじ</button>
        <button type="button" class="tplBtn" data-id="tap">連打</button>
      </div>

      <div class="mode-switch">
        <button id="showEditTab" type="button" class="active">✏️ コードを書く</button>
        <button id="showViewTab" type="button">👀 プレビューを見る</button>
      </div>

      <div id="editPanel" class="card">
        <div class="meta-grid">
          <input id="pageTitleInput" class="input-box" type="text" placeholder="ページのタイトル" />
          <input id="authorInput" class="input-box" type="text" placeholder="作った人（ニックネーム・任意）" />
        </div>
        <textarea id="codeInput" class="editor" spellcheck="false"></textarea>
        <div class="media-area">
          <strong>画像・音声を入れる（Base64）</strong>
          <div class="media-flex">
            <input id="filePicker" type="file" accept="image/*,audio/*" />
            <button id="addFileBtn" type="button">追加</button>
          </div>
          <div id="fileNote" style="color:#64748b; margin-top:4px; font-size:0.78rem;">
            選んだファイルをコードに埋め込みます。
          </div>
        </div>
      </div>

      <div id="previewPanel" class="card hide">
        <iframe id="previewIframe" class="stage" sandbox="allow-scripts allow-forms allow-modals"></iframe>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMFcak07d3Yv1OCrWS-Src_EELS-k61PE",
      authDomain: "darepro-app.firebaseapp.com",
      projectId: "darepro-app",
      storageBucket: "darepro-app.firebasestorage.app",
      messagingSenderId: "271221638275",
      appId: "1:271221638275:web:ec12213c89a8fd29c887b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COL = "darepro_pages";

    const TPLS = {
      card: {
        title: "ぼくの自己紹介",
        html: "<!DOCTYPE html><html><body style='font-family:sans-serif;text-align:center;padding:40px;background:#eff6ff;'><h1>🌟 自己紹介</h1><p>好きなこと：ゲームとプログラミング</p><button onclick=\"alert('ありがとう！')\">押してみて</button></body></html>"
      },
      luck: {
        title: "今日のおみくじ",
        html: "<!DOCTYPE html><html><body style='font-family:sans-serif;text-align:center;padding:40px;background:#fff1f2;'><h1>🎋 おみくじ</h1><div id='out' style='font-size:2rem;margin:20px;'>？</div><button onclick=\"const a=['大吉','中吉','小吉','吉'];document.getElementById('out').textContent=a[Math.floor(Math.random()*a.length)]\">引く</button></body></html>"
      },
      tap: {
        title: "連打ゲーム",
        html: "<!DOCTYPE html><html><body style='font-family:sans-serif;text-align:center;padding:40px;background:#ecfdf5;'><h1>⚡ 連打</h1><div id='num' style='font-size:2.5rem;margin:20px;'>0</div><button onclick=\"const el=document.getElementById('num');el.textContent=Number(el.textContent)+1\">タップ</button></body></html>"
      }
    };

    const qs = new URLSearchParams(location.search);
    const pid = qs.get("p");
    const editKeyParam = qs.get("edit");

    let activePageId = null;
    let activeEditKey = null;
    let isOwnerEditing = false;

    const viewerScreen = document.getElementById("viewerScreen");
    const editorScreen = document.getElementById("editorScreen");
    const editorHeaderTitle = document.getElementById("editorHeaderTitle");
    const vTitle = document.getElementById("vTitle");
    const vAuthor = document.getElementById("vAuthor");
    const vFrame = document.getElementById("vFrame");
    const vHomeLink = document.getElementById("vHomeLink");

    const pageTitleInput = document.getElementById("pageTitleInput");
    const authorInput = document.getElementById("authorInput");
    const codeInput = document.getElementById("codeInput");
    const previewIframe = document.getElementById("previewIframe");
    const msgBox = document.getElementById("msgBox");
    const shareBox = document.getElementById("shareBox");
    const viewUrlInput = document.getElementById("viewUrlInput");
    const editUrlInput = document.getElementById("editUrlInput");
    const copyViewBtn = document.getElementById("copyViewBtn");
    const copyEditBtn = document.getElementById("copyEditBtn");
    const openViewLink = document.getElementById("openViewLink");

    const showEditTab = document.getElementById("showEditTab");
    const showViewTab = document.getElementById("showViewTab");
    const editPanel = document.getElementById("editPanel");
    const previewPanel = document.getElementById("previewPanel");

    const runCodeBtn = document.getElementById("runCodeBtn");
    const publishCodeBtn = document.getElementById("publishCodeBtn");
    const filePicker = document.getElementById("filePicker");
    const addFileBtn = document.getElementById("addFileBtn");
    const fileNote = document.getElementById("fileNote");

    function setMsg(t) { msgBox.textContent = t; }

    function baseUrl() {
      const u = new URL(location.href);
      u.search = "";
      return u.toString();
    }

    function buildViewUrl(id) {
      const u = new URL(location.href);
      u.search = "";
      u.searchParams.set("p", id);
      return u.toString();
    }

    function buildEditUrl(id, key) {
      const u = new URL(location.href);
      u.search = "";
      u.searchParams.set("p", id);
      u.searchParams.set("edit", key);
      return u.toString();
    }

    function updateView() {
      previewIframe.srcdoc = codeInput.value;
    }

    function switchTab(mode) {
      if (mode === "view") {
        updateView();
        showEditTab.classList.remove("active");
        showViewTab.classList.add("active");
        editPanel.classList.add("hide");
        previewPanel.classList.remove("hide");
      } else {
        showViewTab.classList.remove("active");
        showEditTab.classList.add("active");
        previewPanel.classList.add("hide");
        editPanel.classList.remove("hide");
      }
    }

    function makeId(len = 6) {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789";
      let s = "";
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    function makeEditKey(len = 14) {
      const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s = "";
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    async function copyText(text, btn, defaultLabel) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
      }
      btn.textContent = "コピー済";
      setTimeout(() => { btn.textContent = defaultLabel; }, 1500);
    }

    showEditTab.addEventListener("click", () => switchTab("edit"));
    showViewTab.addEventListener("click", () => switchTab("view"));
    runCodeBtn.addEventListener("click", () => {
      switchTab("view");
      setMsg("プレビューを更新しました！");
    });

    document.querySelectorAll(".tplBtn").forEach((b) => {
      b.addEventListener("click", () => {
        const t = TPLS[b.dataset.id];
        if (!t) return;
        pageTitleInput.value = t.title;
        codeInput.value = t.html;
        updateView();
        setMsg("「" + t.title + "」を読み込みました。");
      });
    });

    addFileBtn.addEventListener("click", () => {
      const f = filePicker.files && filePicker.files[0];
      if (!f) {
        fileNote.textContent = "ファイルを選んでから「追加」を押してください。";
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const tag = f.type.startsWith("image/")
          ? "\n<img src=\"" + reader.result + "\" style=\"max-width:100%;\" />\n"
          : f.type.startsWith("audio/")
          ? "\n<audio controls src=\"" + reader.result + "\"></audio>\n"
          : "";
        if (!tag) {
          fileNote.textContent = "画像か音声ファイルを選んでください。";
          return;
        }
        codeInput.value += tag;
        updateView();
        fileNote.textContent = "「" + f.name + "」を追加しました。";
      };
      reader.readAsDataURL(f);
    });

    publishCodeBtn.addEventListener("click", async () => {
      const code = codeInput.value.trim();
      if (!code) {
        setMsg("コードが空です。");
        return;
      }
      publishCodeBtn.disabled = true;
      publishCodeBtn.textContent = "保存中...";

      try {
        const title = pageTitleInput.value.trim() || "無題";
        const author = authorInput.value.trim();

        let id = activePageId;
        let key = activeEditKey;

        if (!isOwnerEditing || !id || !key) {
          id = makeId(6);
          key = makeEditKey(14);
        }

        await setDoc(doc(db, COL, id), {
          title,
          author,
          code,
          editKey: key,
          updatedAt: serverTimestamp()
        }, { merge: true });

        activePageId = id;
        activeEditKey = key;
        isOwnerEditing = true;
        editorHeaderTitle.textContent = "誰プロ（自分のページを修正中）";
        publishCodeBtn.textContent = "💾 上書き保存";

        const vUrl = buildViewUrl(id);
        const eUrl = buildEditUrl(id, key);
        viewUrlInput.value = vUrl;
        openViewLink.href = vUrl;
        editUrlInput.value = eUrl;
        shareBox.classList.add("show");

        setMsg("保存しました！同じ「見る用URL」のまま中身が更新されます。");
      } catch (e) {
        console.error(e);
        setMsg("保存に失敗しました。Firestoreの設定を確認してください。");
      } finally {
        publishCodeBtn.disabled = false;
        if (!isOwnerEditing) {
          publishCodeBtn.textContent = "🚀 公開する";
        } else {
          publishCodeBtn.textContent = "💾 上書き保存";
        }
      }
    });

    copyViewBtn.addEventListener("click", () => copyText(viewUrlInput.value, copyViewBtn, "コピー"));
    copyEditBtn.addEventListener("click", () => copyText(editUrlInput.value, copyEditBtn, "コピー"));

    async function showViewer(data) {
      viewerScreen.classList.remove("hide");
      editorScreen.classList.add("hide");
      const title = data.title || "無題";
      document.title = title + " - 誰プロ";
      vTitle.textContent = title;
      vAuthor.textContent = data.author ? "作：" + data.author : "誰プロ作品";
      vFrame.srcdoc = data.code;
    }

    async function init() {
      vHomeLink.href = baseUrl();

      if (pid) {
        try {
          const snap = await getDoc(doc(db, COL, pid));
          if (!snap.exists() || !snap.data().code) {
            viewerScreen.classList.remove("hide");
            editorScreen.classList.add("hide");
            vTitle.textContent = "ページが見つかりません";
            return;
          }

          const d = snap.data();

          // 本人だけが持つ edit キーが一致した場合のみ修正モードへ
          if (editKeyParam && d.editKey && editKeyParam === d.editKey) {
            viewerScreen.classList.add("hide");
            editorScreen.classList.remove("hide");
            activePageId = pid;
            activeEditKey = d.editKey;
            isOwnerEditing = true;
            editorHeaderTitle.textContent = "誰プロ（自分のページを修正中）";
            publishCodeBtn.textContent = "💾 上書き保存";

            pageTitleInput.value = d.title || "無題";
            authorInput.value = d.author || "";
            codeInput.value = d.code;
            updateView();

            const vUrl = buildViewUrl(pid);
            const eUrl = buildEditUrl(pid, d.editKey);
            viewUrlInput.value = vUrl;
            openViewLink.href = vUrl;
            editUrlInput.value = eUrl;
            shareBox.classList.add("show");
            setMsg("自分のページを読み込みました！コードを直して「💾 上書き保存」を押すと公開ページに反映されます。");
            return;
          }

          // それ以外の人は「見る・遊ぶ専用」画面
          await showViewer(d);
          return;
        } catch (e) {
          console.error(e);
          viewerScreen.classList.remove("hide");
          editorScreen.classList.add("hide");
          vTitle.textContent = "読み込みエラー";
          return;
        }
      }

      editorScreen.classList.remove("hide");
      viewerScreen.classList.add("hide");
      pageTitleInput.value = TPLS.card.title;
      codeInput.value = TPLS.card.html;
      updateView();
    }

    init();
  </script>
</body>
</html>
